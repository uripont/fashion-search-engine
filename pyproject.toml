[project]
name = "fashion-search"
version = "0.1.0"
description = "A search engine for fashion e-commerce products, with classic and embedding-based ranking, RAG result summaries and web analytics"
requires-python = ">=3.12,<3.13"
dependencies = [
    "en-core-web-sm",
    "matplotlib>=3.11.2",
    "nltk>=3.10.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "spacy>=3.8.16",
    "wordcloud>=1.9.6",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]
